<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini FL Studio Pro (Fixed Export)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* --- ESTILOS GENERALES --- */
        body { background-color: #121212; color: #d4d4d4; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; user-select: none; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* --- UI COMPONENTS --- */
        .btn-fl { @apply px-3 py-1 rounded text-xs font-bold transition-all border border-[#444] bg-[#333] text-gray-200; }
        .btn-fl:hover { @apply bg-[#444] border-[#555]; }
        .btn-fl:active { @apply transform translate-y-[1px]; }
        .btn-icon { @apply p-2 flex items-center justify-center transition-colors; }

        /* --- CHANNEL RACK --- */
        .channel-row { display: flex; align-items: center; height: 48px; padding: 0 12px; border-bottom: 1px solid #2a2a2a; background-color: #1e1e1e; cursor: pointer; transition: background-color 0.2s; }
        .channel-row:hover { background-color: #252525; }
        .channel-row.selected { background-color: #2a2a2a; border-left: 4px solid #22c55e; padding-left: 8px; }
        
        .track-control-btn { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border-radius: 2px; border: 1px solid #444; color: #888; margin-right: 4px; transition: all 0.1s; }
        .track-control-btn:hover { color: white; border-color: #666; }
        .btn-mute.active { background-color: #ef4444; border-color: #b91c1c; color: white; }
        .btn-solo.active { background-color: #22c55e; border-color: #15803d; color: white; }

        /* --- PIANO ROLL --- */
        .grid-wrapper { display: grid; grid-template-columns: 60px 1fr; height: 100%; overflow: hidden; }
        .keys-container { background: #181818; border-right: 1px solid #333; z-index: 10; overflow: hidden; }
        .grid-scroll-area { overflow: auto; position: relative; background: #141414; }
        .piano-grid { display: grid; background-color: #1e1e1e; }

        .cell { height: 24px; background-color: #222; border-right: 1px solid #2a2a2a; border-bottom: 1px solid #2a2a2a; position: relative; }
        .cell.row-sharp { background-color: #1a1a1a; }
        .cell.beat-start { border-left: 1px solid #3d3d3d; }
        .cell:hover { background-color: #333; }
        .cell.active { background-color: #4ade80; border: 1px solid #22c55e; box-shadow: inset 0 0 4px rgba(0,0,0,0.5); z-index: 5; }

        .piano-key { height: 24px; border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: flex-end; padding-right: 4px; font-size: 10px; color: #888; background: #2d2d2d; position: relative; }
        .piano-key.sharp { background: #111; color: #666; }
        .piano-key span { z-index: 2; }

        .timeline { height: 24px; background: #1a1a1a; border-bottom: 1px solid #444; display: flex; position: sticky; top: 0; z-index: 20; }
        .time-marker { flex-shrink: 0; border-right: 1px solid #333; font-size: 9px; color: #666; display: flex; align-items: center; padding-left: 4px; }
        .time-marker.current { background: rgba(245, 158, 11, 0.3); border-bottom: 2px solid #f59e0b; }

        #startOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; transition: opacity 0.3s ease; }
        .pointer-events-none { pointer-events: none; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- OVERLAY -->
    <div id="startOverlay">
        <h1 class="text-5xl font-bold text-gray-100 mb-2 tracking-widest">FL<span class="text-green-500">WEB</span></h1>
        <p class="text-gray-400 mb-8 font-mono text-sm">Motor de audio listo. Haz clic para activar.</p>
        <button id="startAppBtn" class="bg-orange-600 hover:bg-orange-500 text-white font-bold py-4 px-12 rounded shadow-2xl transform transition hover:scale-105 border-2 border-orange-400 cursor-pointer">
            ACTIVAR SONIDO
        </button>
    </div>

    <!-- HEADER -->
    <header class="h-14 bg-[#202020] border-b border-[#333] flex items-center justify-between px-4 shadow-lg shrink-0">
        <div class="flex items-center gap-4">
            <h1 class="text-lg font-bold tracking-widest text-gray-100">FL<span class="text-green-500">WEB</span></h1>
            <div class="flex bg-[#111] rounded p-1 gap-1 border border-[#333]">
                <button id="playBtn" class="btn-icon w-8 h-8 rounded hover:bg-[#333] text-green-500 hover:text-green-400" title="Play/Pause">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button id="stopBtn" class="btn-icon w-8 h-8 rounded hover:bg-[#333] text-gray-400 hover:text-white" title="Stop">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>
                </button>
                <button id="recBtn" class="btn-icon w-8 h-8 rounded hover:bg-[#333] text-red-500 hover:text-red-400" title="Exportar Audio (.wav)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
                </button>
            </div>
            <div class="flex items-center gap-3 bg-[#2a2a2a] px-3 py-1 rounded border border-[#333]">
                <div class="flex flex-col">
                    <span class="text-[9px] text-gray-500 font-bold">TEMPO</span>
                    <input type="number" id="tempoInput" value="130" min="40" max="240" class="w-12 bg-transparent text-green-500 font-mono text-sm focus:outline-none text-center">
                </div>
                <div class="h-6 w-[1px] bg-[#444]"></div>
                <div class="flex flex-col w-24">
                    <span class="text-[9px] text-gray-500 font-bold">VOLUMEN</span>
                    <input type="range" id="masterVol" min="0" max="1" step="0.01" value="0.8" class="h-1 bg-gray-600 rounded appearance-none cursor-pointer w-full">
                </div>
            </div>
        </div>
        <div class="flex gap-2">
            <button id="saveProjectBtn" class="btn-fl text-blue-400 border-blue-900/50 hover:bg-blue-900/30">Guardar (.minifl)</button>
            <label class="btn-fl text-yellow-400 border-yellow-900/50 hover:bg-yellow-900/30 cursor-pointer">
                Abrir (.minifl)
                <input type="file" id="loadProjectInput" accept=".minifl,.zip" class="hidden">
            </label>
            <button id="resetBtn" class="btn-fl text-red-400 border-red-900/50 hover:bg-red-900/30 ml-2">Reset</button>
        </div>
    </header>

    <!-- MAIN -->
    <main class="flex-1 flex overflow-hidden">
        <aside class="w-72 bg-[#181818] border-r border-[#333] flex flex-col shrink-0 z-20 shadow-xl">
            <div class="p-3 border-b border-[#333] flex justify-between items-center bg-[#202020]">
                <span class="text-xs font-bold text-gray-400 tracking-wider">CHANNEL RACK</span>
                <button id="addTrackBtn" class="text-green-500 hover:text-green-400 font-bold text-xl leading-none px-2 py-1 hover:bg-[#333] rounded" title="Añadir nueva pista">+</button>
            </div>
            <div id="trackList" class="flex-1 overflow-y-auto bg-[#121212]"></div>
            <div class="p-3 border-t border-[#333] bg-[#1a1a1a]">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[10px] text-gray-500 uppercase">Sample de la pista</span>
                </div>
                <label class="flex items-center gap-2 bg-[#252525] p-2 rounded cursor-pointer hover:bg-[#333] transition border border-[#333] group">
                    <svg class="text-gray-400 group-hover:text-white" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <span class="text-xs text-gray-300 truncate w-40" id="sampleNameDisplay">...</span>
                    <input type="file" id="sampleInput" accept="audio/*" class="hidden">
                </label>
            </div>
        </aside>
        <div class="flex-1 flex flex-col bg-[#141414] min-w-0">
            <div class="h-8 bg-[#1f1f1f] border-b border-[#333] flex items-center justify-between px-2 shrink-0">
                <span id="currentTrackName" class="text-xs font-bold text-green-500 uppercase tracking-wider pl-2">Track 1</span>
                <button id="addBarsBtn" class="btn-fl text-[10px] py-0 h-6 flex items-center gap-1">
                    <span>+</span> Extender Rejilla
                </button>
            </div>
            <div class="flex-1 grid-wrapper relative">
                <div id="keysContainer" class="keys-container"></div>
                <div id="gridScrollArea" class="grid-scroll-area">
                    <div id="timeline" class="timeline"></div>
                    <div id="pianoGrid" class="piano-grid"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // === HELPERS & CONSTANTS ===
        const FNF_URLS = [
            'https://logise1.github.io/fnfstudio/up.wav',
            'https://logise1.github.io/fnfstudio/down.wav',
            'https://logise1.github.io/fnfstudio/left.wav',
            'https://logise1.github.io/fnfstudio/right.wav'
        ];
        
        let fnfSamplesData = [];

        const NOTE_NAMES = ['B', 'A#', 'A', 'G#', 'G', 'F#', 'F', 'E', 'D#', 'D', 'C#', 'C'];
        const OCTAVES = [6, 5, 4, 3]; 
        let FULL_NOTES = [];
        OCTAVES.forEach(oct => {
            NOTE_NAMES.forEach(note => {
                FULL_NOTES.push({ note, oct, name: `${note}${oct}`, isSharp: note.includes('#') });
            });
        });

        const DEFAULT_ROOT_MIDI = 65; 

        // === PITCH DETECTION ===
        function detectPitch(buffer) {
            const float32AudioBuffer = buffer.getChannelData(0);
            const sampleRate = buffer.sampleRate;
            let startIdx = 0;
            const threshold = 0.05;
            for(let i=0; i<float32AudioBuffer.length; i++) {
                if(Math.abs(float32AudioBuffer[i]) > threshold) {
                    startIdx = i;
                    break;
                }
            }
            const SIZE = 4096;
            if (startIdx + SIZE >= float32AudioBuffer.length) startIdx = 0; 
            const chunk = float32AudioBuffer.slice(startIdx, startIdx + SIZE);
            const L = chunk.length;
            let rms = 0;
            for (let i=0; i<L; i++) rms += chunk[i]*chunk[i];
            rms = Math.sqrt(rms/L);
            if (rms < 0.01) return -1; 

            const minPeriod = Math.floor(sampleRate / 1000); 
            const maxPeriod = Math.floor(sampleRate / 70); 
            let bestPeriod = 0;
            let maxCorr = 0;

            for (let lag = minPeriod; lag <= maxPeriod; lag++) {
                if(lag >= L) break;
                let sum = 0;
                for (let i = 0; i < L - lag; i++) sum += chunk[i] * chunk[i+lag];
                if (sum > maxCorr) { maxCorr = sum; bestPeriod = lag; }
            }
            if (bestPeriod > 0) return sampleRate / bestPeriod;
            return -1;
        }

        function freqToMidi(freq) {
            return 69 + 12 * Math.log2(freq / 440);
        }

        // === HELPERS BASE64 ===
        const blobToBase64 = blob => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
        const base64ToBlob = async (base64) => {
            const res = await fetch(base64);
            return await res.blob();
        };

        // === ESTADO GLOBAL ===
        let audioCtx;
        let masterGain;
        let isPlaying = false;
        let tempo = 130;
        let currentStep = 0;
        let nextNoteTime = 0.0;
        let lookahead = 25.0;
        let scheduleAheadTime = 0.1;
        let timerID;
        let totalSteps = 32; 
        let activeTrackId = 0;
        let tracks = [];

        // === DOM ELEMENTS ===
        const gridScrollArea = document.getElementById('gridScrollArea');
        const keysContainer = document.getElementById('keysContainer');
        const pianoGrid = document.getElementById('pianoGrid');
        const timeline = document.getElementById('timeline');
        const trackList = document.getElementById('trackList');
        const sampleNameDisplay = document.getElementById('sampleNameDisplay');
        const startOverlay = document.getElementById('startOverlay');
        const startAppBtn = document.getElementById('startAppBtn');

        // === AUDIO ENGINE ===
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.8;
                masterGain.connect(audioCtx.destination);
            }
            return audioCtx;
        }

        async function preloadFnfSamples() {
            const ctx = getAudioContext();
            fnfSamplesData = []; 
            const names = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
            
            for (let i=0; i<FNF_URLS.length; i++) {
                const url = FNF_URLS[i];
                try {
                    const res = await fetch(url);
                    const ab = await res.arrayBuffer();
                    const buffer = await ctx.decodeAudioData(ab);
                    const freq = detectPitch(buffer);
                    let rootMidi = DEFAULT_ROOT_MIDI;
                    if (freq > 0) rootMidi = freqToMidi(freq);
                    fnfSamplesData.push({ buffer, rootMidi });
                } catch (e) {
                    console.error("Error cargando sample FNF:", url, e);
                }
            }
        }

        class Track {
            constructor(id, name, color = '#4ade80') {
                this.id = id;
                this.name = name;
                this.color = color;
                this.buffer = null; 
                this.rootMidi = DEFAULT_ROOT_MIDI; 
                this.sourceBlob = null; 
                this.base64Data = null; 
                this.sampleUrl = null;
                this.notes = {}; 
                this.muted = false;
                this.solo = false;
                this.isLoading = false;
                this.isRandom = true; 
            }

            async loadSample(input) {
                this.isLoading = true;
                this.isRandom = false; 
                renderTrackList(); 
                try {
                    const ctx = getAudioContext();
                    let arrayBuffer;
                    if (input instanceof Blob) {
                        this.sourceBlob = input;
                        this.sampleUrl = null; 
                        arrayBuffer = await input.arrayBuffer();
                        this.base64Data = await blobToBase64(input);
                    } else if (typeof input === 'string') {
                        if (input.startsWith('data:')) {
                            this.base64Data = input;
                            this.sourceBlob = await base64ToBlob(input);
                            arrayBuffer = await this.sourceBlob.arrayBuffer();
                            this.sampleUrl = null;
                        } else {
                            this.sampleUrl = input;
                            const response = await fetch(input);
                            this.sourceBlob = await response.blob();
                            arrayBuffer = await this.sourceBlob.arrayBuffer();
                            this.base64Data = await blobToBase64(this.sourceBlob);
                        }
                    }
                    this.buffer = await ctx.decodeAudioData(arrayBuffer);
                    const freq = detectPitch(this.buffer);
                    if (freq > 0) this.rootMidi = freqToMidi(freq);
                    else this.rootMidi = DEFAULT_ROOT_MIDI;
                } catch (e) {
                    console.error(`Error loading sample for ${this.name}:`, e);
                    this.isRandom = true; 
                } finally {
                    this.isLoading = false;
                    renderTrackList();
                    saveToLocalStorage();
                }
            }
        }

        function getPlaybackRate(targetMidi, rootMidi) {
            return Math.pow(2, (targetMidi - rootMidi) / 12);
        }

        function getCellMidi(rowIndex) {
            const noteObj = FULL_NOTES[rowIndex];
            const notesScale = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const noteInScale = notesScale.indexOf(noteObj.note);
            return (noteObj.oct + 1) * 12 + noteInScale;
        }

        function playSound(track, noteIndex, time, ctx = null, dest = null) {
            if (track.muted) return;
            const anySolo = tracks.some(t => t.solo);
            if (anySolo && !track.solo) return;

            let bufferToUse = null;
            let rootMidiToUse = DEFAULT_ROOT_MIDI;

            if (track.isRandom) {
                if (fnfSamplesData.length > 0) {
                    const rand = fnfSamplesData[Math.floor(Math.random() * fnfSamplesData.length)];
                    bufferToUse = rand.buffer;
                    rootMidiToUse = rand.rootMidi;
                } else {
                    return; // Si no hay samples FNF cargados, no sonar nada (evita crash)
                }
            } else {
                bufferToUse = track.buffer;
                rootMidiToUse = track.rootMidi;
            }

            if (!bufferToUse) return;

            const context = ctx || getAudioContext();
            try {
                const source = context.createBufferSource();
                source.buffer = bufferToUse;
                const targetMidi = getCellMidi(noteIndex);
                source.playbackRate.value = getPlaybackRate(targetMidi, rootMidiToUse);
                const gain = context.createGain();
                gain.gain.value = 1.0; 
                source.connect(gain);
                if (dest) gain.connect(dest);
                else gain.connect(masterGain);
                source.start(time);
            } catch(e) { }
        }

        // === STORAGE & INIT ===
        function saveToLocalStorage() {
            try {
                const state = {
                    tempo,
                    totalSteps,
                    tracks: tracks.map(t => ({
                        id: t.id, name: t.name, color: t.color, notes: t.notes,
                        muted: t.muted, solo: t.solo, isRandom: t.isRandom,
                        sampleBase64: t.base64Data, sampleUrl: t.sampleUrl, rootMidi: t.rootMidi
                    }))
                };
                localStorage.setItem('minifl_project_v3', JSON.stringify(state));
            } catch (e) {}
        }

        async function loadFromLocalStorage() {
            const raw = localStorage.getItem('minifl_project_v3');
            if(!raw) return false;
            try {
                const state = JSON.parse(raw);
                tempo = state.tempo || 130;
                totalSteps = state.totalSteps || 32;
                document.getElementById('tempoInput').value = tempo;
                tracks = [];
                for (const tData of state.tracks) {
                    const t = new Track(tData.id, tData.name, tData.color);
                    t.notes = tData.notes || {};
                    t.muted = tData.muted || false;
                    t.solo = tData.solo || false;
                    t.isRandom = (tData.isRandom !== undefined) ? tData.isRandom : true;
                    t.rootMidi = tData.rootMidi || DEFAULT_ROOT_MIDI;
                    if (!t.isRandom) {
                        if (tData.sampleBase64) await t.loadSample(tData.sampleBase64);
                        else if (tData.sampleUrl) await t.loadSample(tData.sampleUrl);
                    }
                    tracks.push(t);
                }
                if(tracks.length > 0) selectTrack(0);
                renderGrid();
                return true;
            } catch(e) { return false; }
        }

        function clearLocalStorage() { localStorage.removeItem('minifl_project_v3'); location.reload(); }

        // === SCHEDULER ===
        function nextNote() {
            const secondsPerBeat = 60.0 / tempo;
            nextNoteTime += 0.25 * secondsPerBeat; 
            currentStep++;
            if (currentStep >= totalSteps) currentStep = 0; 
        }
        function scheduleNote(step, time) {
            const ctx = getAudioContext();
            setTimeout(() => drawPlayhead(step), (time - ctx.currentTime) * 1000);
            tracks.forEach(track => {
                for (let i = 0; i < FULL_NOTES.length; i++) {
                    if (track.notes[`${step}_${i}`]) playSound(track, i, time);
                }
            });
        }
        function scheduler() {
            const ctx = getAudioContext();
            while (nextNoteTime < ctx.currentTime + scheduleAheadTime) {
                scheduleNote(currentStep, nextNoteTime);
                nextNote();
            }
            if (isPlaying) timerID = setTimeout(scheduler, lookahead);
        }
        function play() {
            if (isPlaying) { stop(); return; }
            const ctx = getAudioContext();
            if(ctx.state === 'suspended') ctx.resume();
            isPlaying = true;
            currentStep = 0;
            nextNoteTime = ctx.currentTime;
            scheduler();
            document.getElementById('playBtn').classList.add('text-green-300', 'bg-green-900/50');
        }
        function stop() {
            isPlaying = false;
            clearTimeout(timerID);
            drawPlayhead(-1);
            document.getElementById('playBtn').classList.remove('text-green-300', 'bg-green-900/50');
        }

        // === EXPORTAR WAV (CORREGIDO) ===
        // Función estándar y robusta para WAV 16-bit PCM
        function bufferToWav(buffer, len) {
            let numOfChan = buffer.numberOfChannels,
                length = len * numOfChan * 2 + 44,
                bufferArr = new ArrayBuffer(length),
                view = new DataView(bufferArr),
                channels = [], i, sample, offset = 0, pos = 0;

            // Headers WAV PCM
            setUint32(0x46464952); // "RIFF"
            setUint32(length - 8); // file length - 8
            setUint32(0x45564157); // "WAVE"
            setUint32(0x20746d66); // "fmt " chunk
            setUint32(16); // length = 16
            setUint16(1); // PCM (uncompressed)
            setUint16(numOfChan);
            setUint32(buffer.sampleRate);
            setUint32(buffer.sampleRate * 2 * numOfChan); // avg. bytes/sec
            setUint16(numOfChan * 2); // block-align
            setUint16(16); // 16-bit
            setUint32(0x61746164); // "data" - chunk
            setUint32(length - pos - 4); // chunk length

            // Escribir datos entrelazados
            for(i = 0; i < numOfChan; i++) channels.push(buffer.getChannelData(i));

            while(pos < len) {
                for(i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][pos])); // clamp
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0; // to PCM
                    view.setInt16(offset, sample, true); 
                    offset += 2;
                }
                pos++;
            }

            return new Blob([bufferArr], { type: 'audio/wav' });

            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
        }

        async function renderAudio() {
            if (isPlaying) stop();
            if (!confirm("¿Renderizar proyecto a .wav?")) return;
            
            const btn = document.getElementById('recBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="animate-pulse text-red-500">...</span>`;

            try {
                // Configurar contexto offline
                const secondsPerBeat = 60.0 / tempo;
                // Calculamos duración exacta basada en el último paso que tenga una nota, o totalSteps
                const totalDuration = totalSteps * 0.25 * secondsPerBeat;
                const sr = 44100;
                
                // +2 segundos de cola para reverb/release
                const offlineCtx = new OfflineAudioContext(2, sr * (totalDuration + 2), sr);

                // Programar notas
                console.log("Programando notas...");
                tracks.forEach(track => {
                    if (track.muted) return;
                    const anySolo = tracks.some(t => t.solo);
                    if (anySolo && !track.solo) return;
                    
                    for (let step = 0; step < totalSteps; step++) {
                        const time = step * 0.25 * secondsPerBeat;
                        for (let i = 0; i < FULL_NOTES.length; i++) {
                            if (track.notes[`${step}_${i}`]) {
                                playSound(track, i, time, offlineCtx, offlineCtx.destination);
                            }
                        }
                    }
                });

                console.log("Renderizando audio...");
                const renderedBuffer = await offlineCtx.startRendering();
                
                console.log("Codificando WAV...");
                // Usamos la función robusta corregida
                const blob = bufferToWav(renderedBuffer, renderedBuffer.length);
                
                console.log("Descargando...");
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'mini_fl_pro.wav';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
            } catch (e) {
                console.error("Error exportando:", e);
                alert("Error al exportar el audio. Mira la consola para detalles.");
            } finally {
                btn.innerHTML = originalText;
            }
        }

        async function saveProjectFile() {
            const zip = new JSZip();
            const state = { tempo, totalSteps, tracks: [] };
            for (const t of tracks) {
                const trackMeta = {
                    id: t.id, name: t.name, color: t.color, notes: t.notes,
                    muted: t.muted, solo: t.solo, isRandom: t.isRandom,
                    rootMidi: t.rootMidi, sampleFileName: null 
                };
                if (!t.isRandom) {
                    if (t.sourceBlob) {
                        const fileName = `sample_${t.id}.wav`; 
                        zip.file(`samples/${fileName}`, t.sourceBlob);
                        trackMeta.sampleFileName = fileName;
                    } else if (t.sampleUrl) {
                        trackMeta.sampleUrl = t.sampleUrl; 
                    }
                }
                state.tracks.push(trackMeta);
            }
            zip.file("project.json", JSON.stringify(state, null, 2));
            const content = await zip.generateAsync({type:"blob"});
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'proyecto.minifl';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        async function loadProjectFile(e) {
            const file = e.target.files[0];
            if(!file) return;
            try {
                const zip = await JSZip.loadAsync(file);
                const projectText = await zip.file("project.json").async("string");
                const state = JSON.parse(projectText);
                tempo = state.tempo || 130;
                totalSteps = state.totalSteps || 32;
                document.getElementById('tempoInput').value = tempo;
                tracks = [];
                for (const tData of state.tracks) {
                    const t = new Track(tData.id, tData.name, tData.color);
                    t.notes = tData.notes || {};
                    t.muted = tData.muted || false;
                    t.solo = tData.solo || false;
                    t.isRandom = (tData.isRandom !== undefined) ? tData.isRandom : true;
                    t.rootMidi = tData.rootMidi || DEFAULT_ROOT_MIDI;
                    if (!t.isRandom) {
                        if (tData.sampleFileName) {
                            const sampleFile = zip.file(`samples/${tData.sampleFileName}`);
                            if (sampleFile) {
                                const blob = await sampleFile.async("blob");
                                await t.loadSample(blob);
                            }
                        } else if (tData.sampleUrl) await t.loadSample(tData.sampleUrl);
                    }
                    tracks.push(t);
                }
                if(tracks.length > 0) selectTrack(0);
                renderGrid();
                saveToLocalStorage(); 
                alert("Proyecto cargado con éxito.");
            } catch(err) { alert("Error al abrir .minifl"); }
            e.target.value = '';
        }

        // === UI & INIT ===
        function renderGrid() {
            keysContainer.innerHTML = ''; pianoGrid.innerHTML = ''; timeline.innerHTML = '';
            const colWidth = 30; 
            pianoGrid.style.gridTemplateColumns = `repeat(${totalSteps}, ${colWidth}px)`;
            pianoGrid.style.width = `${totalSteps * colWidth}px`;
            timeline.style.width = `${totalSteps * colWidth}px`;
            FULL_NOTES.forEach((n, rowIndex) => {
                const key = document.createElement('div');
                key.className = `piano-key ${n.isSharp ? 'sharp' : ''}`;
                key.innerHTML = `<span>${n.name}</span>`;
                keysContainer.appendChild(key);
                for (let col = 0; col < totalSteps; col++) {
                    const cell = document.createElement('div');
                    const isBeatStart = col % 4 === 0;
                    cell.className = `cell ${n.isSharp ? 'row-sharp' : ''} ${isBeatStart ? 'beat-start' : ''}`;
                    const currentTrack = tracks[activeTrackId];
                    if (currentTrack && currentTrack.notes[`${col}_${rowIndex}`]) cell.classList.add('active');
                    cell.onmousedown = (e) => handleCellClick(rowIndex, col, cell, e);
                    cell.onmouseenter = (e) => { if (e.buttons === 1) handleCellClick(rowIndex, col, cell, e, true); };
                    pianoGrid.appendChild(cell);
                }
            });
            for(let i=0; i<totalSteps; i++) {
                const mark = document.createElement('div');
                mark.className = 'time-marker';
                mark.style.width = `${colWidth}px`;
                if (i % 4 === 0) mark.textContent = (i/4) + 1;
                mark.id = `time-${i}`;
                timeline.appendChild(mark);
            }
        }

        function handleCellClick(row, col, cell, e, isDrag = false) {
            if (!tracks[activeTrackId]) return; 
            const track = tracks[activeTrackId];
            const key = `${col}_${row}`;
            const ctx = getAudioContext();
            const activate = () => { track.notes[key] = true; cell.classList.add('active'); playSound(track, row, ctx.currentTime); saveToLocalStorage(); };
            const deactivate = () => { delete track.notes[key]; cell.classList.remove('active'); saveToLocalStorage(); };
            if (isDrag) { if (!track.notes[key]) activate(); } 
            else { if (track.notes[key]) deactivate(); else activate(); }
        }

        function renderTrackList() {
            trackList.innerHTML = '';
            tracks.forEach((t, idx) => {
                const row = document.createElement('div');
                row.className = `channel-row ${idx === activeTrackId ? 'selected' : ''}`;
                const btnMute = document.createElement('div');
                btnMute.className = `track-control-btn btn-mute ${t.muted ? 'active' : ''}`;
                btnMute.textContent = 'M';
                btnMute.onclick = (e) => { e.stopPropagation(); t.muted = !t.muted; saveToLocalStorage(); renderTrackList(); };
                const btnSolo = document.createElement('div');
                btnSolo.className = `track-control-btn btn-solo ${t.solo ? 'active' : ''}`;
                btnSolo.textContent = 'S';
                btnSolo.onclick = (e) => { e.stopPropagation(); t.solo = !t.solo; saveToLocalStorage(); renderTrackList(); };
                const infoDiv = document.createElement('div');
                infoDiv.className = "flex-1 min-w-0 flex flex-col justify-center ml-2";
                let statusText = t.isRandom ? "FNF Random" : `Custom (Root: ${Math.round(t.rootMidi)})`;
                infoDiv.innerHTML = `<div class="text-xs font-bold text-gray-200 truncate select-none">${t.name}</div><div class="text-[9px] text-gray-500">${statusText}</div>`;
                const indicator = document.createElement('div');
                indicator.className = "w-2 h-2 rounded-full mr-2";
                indicator.style.backgroundColor = t.color;
                row.appendChild(indicator); row.appendChild(btnMute); row.appendChild(btnSolo); row.appendChild(infoDiv);
                row.onclick = () => selectTrack(idx);
                trackList.appendChild(row);
            });
            updateHeader();
        }

        function selectTrack(idx) { activeTrackId = idx; renderTrackList(); renderGrid(); updateHeader(); }
        function updateHeader() {
            const t = tracks[activeTrackId];
            if(t) {
                document.getElementById('currentTrackName').textContent = t.name;
                if (t.isRandom) sampleNameDisplay.textContent = 'Voces Random FNF';
                else sampleNameDisplay.textContent = t.sampleUrl ? (t.sampleUrl.startsWith('blob:') ? 'Audio Custom' : 'Sample Original') : 'Audio Custom';
            }
        }
        function drawPlayhead(step) {
            document.querySelectorAll('.time-marker.current').forEach(el => el.classList.remove('current'));
            if (step !== -1) {
                const el = document.getElementById(`time-${step}`);
                if (el) {
                    el.classList.add('current');
                    if (step % 8 === 0) gridScrollArea.scrollLeft = el.offsetLeft - (gridScrollArea.offsetWidth / 2) + 15;
                }
            }
        }

        function addTrack(name = "Instrumento") {
            const id = tracks.length;
            const newTrack = new Track(id, name);
            tracks.push(newTrack);
            renderTrackList();
            if (tracks.length === 1) renderGrid();
            saveToLocalStorage();
        }

        async function initApp() {
            const loaded = await loadFromLocalStorage();
            if (!loaded) addTrack("Lead Synth");
            gridScrollArea.addEventListener('scroll', () => { keysContainer.scrollTop = gridScrollArea.scrollTop; });
            document.getElementById('playBtn').onclick = play;
            document.getElementById('stopBtn').onclick = stop;
            document.getElementById('recBtn').onclick = renderAudio;
            document.getElementById('addTrackBtn').onclick = () => addTrack(`Inst ${tracks.length + 1}`);
            document.getElementById('addBarsBtn').onclick = () => { totalSteps += 16; renderGrid(); saveToLocalStorage(); };
            document.getElementById('tempoInput').onchange = (e) => { tempo = parseInt(e.target.value); saveToLocalStorage(); };
            document.getElementById('masterVol').oninput = (e) => masterGain.gain.value = e.target.value;
            document.getElementById('sampleInput').onchange = (e) => {
                const f = e.target.files[0];
                if(f) { tracks[activeTrackId].name = f.name.substring(0,12); tracks[activeTrackId].loadSample(f); }
            };
            document.getElementById('saveProjectBtn').onclick = saveProjectFile;
            document.getElementById('loadProjectInput').onchange = loadProjectFile;
            document.getElementById('resetBtn').onclick = () => { if(confirm("¿Borrar todo y reiniciar?")) clearLocalStorage(); };
        }

        window.onload = initApp;
        startAppBtn.onclick = () => {
            const ctx = getAudioContext();
            try { ctx.resume(); } catch(e) {}
            preloadFnfSamples();
            startOverlay.style.opacity = '0';
            startOverlay.style.pointerEvents = 'none';
            setTimeout(() => startOverlay.classList.add('hidden'), 500);
        };
    </script>
</body>
</html>
